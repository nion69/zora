[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zoraai"
version = "1.3.5"
description = "Zora AI - Autonomous Voice & Everyday Work Assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents>=1.6.10",
    "livekit-plugins-google>=1.6.10",
    "livekit-plugins-noise-cancellation>=0.3.0",
    "google-genai>=2.18.0",
    "python-dotenv",
    "yt-dlp",
    "imageio-ffmpeg",
    "requests",
    "PyAutoGUI",
    "pynput",
    "duckduckgo-search",
    "fuzzywuzzy",
    "python-Levenshtein",
    "pywin32",
    "mss",
    "pillow",
    "langchain",
    "langchain-google-genai",
    "langchain-openai",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "playwright",
    "beautifulsoup4"
]

[project.scripts]
zora = "agent:cli_main"

[tool.setuptools]
py-modules = [
    "agent",
    "nion_auth",
    "nion_browser_controller",
    "nion_connect_mj_on_phone",
    "nion_continuous_vision",
    "nion_emotion_engine",
    "nion_filesystem_agent",
    "nion_file_opner",
    "nion_get_whether",
    "nion_gmail_reader",
    "nion_google_search",
    "nion_keyboard_mouse_CTRL",
    "nion_memory_loop",
    "nion_memory_store",
    "nion_minecraft_setup",
    "nion_music_player",
    "nion_prompts",
    "nion_scheduler",
    "nion_social_messenger",
    "nion_vision",
    "nion_web_creator",
    "nion_window_CTRL"
]
